name: Linters

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: ESLint Report
        run: npm run lint

  stylelint:
    name: Stylelint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Stylelint Report
        run: npm run lint:css

  nodechecker:
    name: node_modules checker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check tracked node_modules files
        run: |
          tracked_modules=$(git ls-files -- 'node_modules/**' '**/node_modules/**')
          if [ -n "$tracked_modules" ]; then
            echo "::error::node_modules files are tracked. Remove them from Git and add node_modules to .gitignore."
            exit 1
          fi

  test-build:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build production assets
        run: npm run build
